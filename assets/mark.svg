<!-- The app mark: first light rising out of an open book. Geometry matches
     Scripts/make-app-icon.py, cropped to the artwork and weighted a little
     heavier, because the icon's hairline stroke disappears at wordmark size.
     Used as a CSS mask, so the colour stays a token rather than living here. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20.2 32.7 59.6 34.7" fill="none"
     stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <clipPath id="horizon">
    <path d="M20.2 30H79.8V44.55L50 54.2 20.2 44.55Z"/>
  </clipPath>
  <path d="M30.5 54.2A19.5 19.5 0 0 1 69.5 54.2" clip-path="url(#horizon)"/>
  <path d="M22.2 45.2V58.2L50 65.4 77.8 58.2V45.2L50 54.2Z"/>
  <path d="M50 54.2V65.4"/>
</svg>
