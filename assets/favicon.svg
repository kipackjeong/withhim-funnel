<!-- Tab and home-screen icon: the mark on the site's ink ground, so it holds
     its own contrast against light and dark browser chrome alike.

     The three mark paths are duplicated from mark.svg rather than <use>d, as
     cross-file references don't resolve when an SVG is loaded as an image.
     The nested <svg> fits and centres them, so changing the tile size needs no
     offset maths. Stroke is far heavier than the app icon's: a hairline is
     gone by 16px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#0A0C11"/>
  <svg x="12" y="12" width="76" height="76" viewBox="20.2 32.7 59.6 34.7"
       fill="none" stroke="#E8A94B" stroke-width="5.1"
       stroke-linecap="round" stroke-linejoin="round">
    <clipPath id="horizon">
      <path d="M20.2 30H79.8V44.55L50 54.2 20.2 44.55Z"/>
    </clipPath>
    <path d="M30.5 54.2A19.5 19.5 0 0 1 69.5 54.2" clip-path="url(#horizon)"/>
    <path d="M22.2 45.2V58.2L50 65.4 77.8 58.2V45.2L50 54.2Z"/>
    <path d="M50 54.2V65.4"/>
  </svg>
</svg>
